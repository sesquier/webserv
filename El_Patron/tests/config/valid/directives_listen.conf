# Every accepted form, the port limits, and a port shared by two addresses.
server {
    listen 1;
    listen 65535;
    listen 127.0.0.1:8102;
    listen localhost:8103;
    listen 0.0.0.0:8104;
    listen 192.168.1.10:8105;
    listen 192.168.1.11:8105;
    listen 255.255.255.255:8106;
    root ./www/site1;
}
