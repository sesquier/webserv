# Defaults apply only to what is absent: the second server and location set their own values.
server {
    listen 8108;
    root ./www/site1;
    location /absent {
    }
    location /own {
        methods POST;
    }
}

server {
    listen 8109;
    root ./www/site2;
    index home.html;
    client_max_body_size 0;
}
