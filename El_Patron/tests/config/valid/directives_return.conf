# Every accepted redirection code.
server {
    listen 8098;
    root ./www/site1;
    location /a {
        return 301 /;
    }
    location /b {
        return 302 /new;
    }
    location /c {
        return 303 http://example.com/;
    }
    location /d {
        return 307 /new;
    }
    location /e {
        return 308 /new;
    }
}
