# Limits of the range, several codes in a block, and the same code at both levels.
server {
    listen 8100;
    root ./www/site1;
    error_page 400 ./www/errors/400.html;
    error_page 404 ./www/errors/404.html;
    error_page 599 ./www/errors/599.html;
    location /a {
        error_page 404 ./www/errors/a404.html;
        error_page 500 ./www/errors/a500.html;
    }
}
