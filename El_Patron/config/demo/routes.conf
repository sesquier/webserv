# Demo: one route, one behaviour.
#   /         index.html for a directory (index)
#   /docs     another directory (root), listed (autoindex on)
#   /vide     a directory without index nor autoindex: 403
#   /depot    upload, read and delete (POST, GET, DELETE)
#   /lecture  same files, read only: POST and DELETE give 405
#   /ancien   redirection (return 301)

server {
    listen 8080;
    root ./www/demo;
    index index.html;

    location / {
        methods GET;
    }

    location /docs {
        root ./www/demo/docs;
        methods GET;
        autoindex on;
    }

    location /vide {
        root ./www/demo/vide;
        methods GET;
    }

    location /depot {
        root ./www/demo/depot;
        methods GET POST DELETE;
        upload_store ./www/demo/depot;
    }

    location /lecture {
        root ./www/demo/depot;
        methods GET;
    }

    location /ancien {
        return 301 /docs/;
    }
}
