# Demo: several ports, several sites, one program.
#   8080 and 8082 -> the same site (one server, two listen)
#   8081          -> another site, with its own root

server {
    listen 8080;
    listen 8082;
    root ./www/site1;
    index index.html;

    location / {
        methods GET;
    }
}

server {
    listen 8081;
    root ./www/site2;
    index index.html;

    location / {
        methods GET;
    }
}
