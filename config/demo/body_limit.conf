# Demo: client_max_body_size.
#   The server allows 100 bytes; /grand allows 1K (a location overrides its server).

server {
    listen 8080;
    root ./www/demo;
    index index.html;
    client_max_body_size 100;

    location / {
        methods GET;
    }

    location /depot {
        root ./www/demo/depot;
        methods GET POST DELETE;
        upload_store ./www/demo/depot;
    }

    location /grand {
        root ./www/demo/depot;
        methods POST;
        upload_store ./www/demo/depot;
        client_max_body_size 1K;
    }
}
