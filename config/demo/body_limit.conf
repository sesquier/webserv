# Demo: client_max_body_size.
#   The server allows 10 bytes; /large allows 1K (a location overrides its server).

server {
    listen 8080;
    root ./www/demo;
    index index.html;
    client_max_body_size 10;

    location / {
        methods GET;
    }

    location /upload {
        root ./www/demo/uploads;
        methods GET POST DELETE;
        upload_store ./www/demo/uploads;
    }

    location /large {
        root ./www/demo/uploads;
        methods POST;
        upload_store ./www/demo/uploads;
        client_max_body_size 1K;
    }
}
