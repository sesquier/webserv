# Demo: custom error pages (error_page), next to the default ones.
#   403, 404, 405 and 413 have their own page; the others (400, 501...) keep
#   the page generated by webserv.

server {
    listen 8080;
    root ./www/demo;
    index index.html;
    client_max_body_size 100;
    error_page 403 ./www/demo/errors/403.html;
    error_page 404 ./www/demo/errors/404.html;
    error_page 405 ./www/demo/errors/405.html;
    error_page 413 ./www/demo/errors/413.html;

    location / {
        methods GET;
    }

    # No index.html and no autoindex: 403
    location /empty {
        root ./www/demo/empty;
        methods GET POST;
        upload_store ./www/demo/empty;
    }
}
