# Demo: same port, different interfaces (IP addresses).
#   127.0.0.1:8080 -> site 1
#   127.0.0.2:8080 -> site 2
# Every 127.x.x.x address is the local machine on Linux.
# Two servers on the same interface:port are refused (no virtual hosts).

server {
    listen 127.0.0.1:8080;
    root ./www/site1;
    index index.html;

    location / {
        methods GET;
    }
}

server {
    listen 127.0.0.2:8080;
    root ./www/site2;
    index index.html;

    location / {
        methods GET;
    }
}
