# Demo: one route, one behaviour.
#   /          index.html for a directory (index)
#   /docs      another directory (root), listed (autoindex on)
#   /empty     a directory without index nor autoindex: 403
#   /upload    upload, read and delete (POST, GET, DELETE)
#   /readonly  same files, read only: POST and DELETE give 405
#   /old       redirection (return 301)

server {
    listen 8080;
    root ./www/demo;
    index index.html;

    location / {
        methods GET;
    }

    location /docs {
        root ./www/demo/docs;
        methods GET;
        autoindex on;
    }

    location /empty {
        root ./www/demo/empty;
        methods GET;
    }

    location /upload {
        root ./www/demo/uploads;
        methods GET POST DELETE;
        upload_store ./www/demo/uploads;
    }

    location /readonly {
        root ./www/demo/uploads;
        methods GET;
    }

    location /old {
        return 301 /docs/;
    }
}
