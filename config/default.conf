# webserv - default configuration
# All paths are relative to the directory ./webserv is launched from
# (the repository root).

# ===== Site 1: showcase of every feature =====
server {
    listen 127.0.0.1:8080;
    root ./www/site1;
    index index.html;
    client_max_body_size 1M;
    error_page 404 ./www/site1/errors/404.html;

    # Static pages of the site
    location / {
        methods GET;
    }

    # Browsable directory: automatic listing (no index.html inside)
    location /files {
        root ./www/site1/files;
        methods GET;
        autoindex on;
    }

    # Upload, read and delete files
    location /upload {
        root ./www/site1/uploads;
        methods GET POST DELETE;
        upload_store ./www/site1/uploads;
        client_max_body_size 10M;
    }

    # Scripts run through the CGI
    location /cgi-bin {
        root ./www/site1/cgi-bin;
        methods GET POST;
        cgi .py /usr/bin/python3;
        cgi .pl /usr/bin/perl;
        cgi .sh /bin/bash;
    }

    # Old URL redirected to the home page
    location /old {
        return 301 /;
    }
}

# ===== Site 2: different content on another port =====
server {
    listen 8081;
    root ./www/site2;
    index index.html;

    location / {
        methods GET;
    }
}
