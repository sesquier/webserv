# root and index at both levels, and the same name in two blocks is not a duplicate.
server {
    listen 8094;
    root ./www/site1;
    index home.html;
    location /a {
        root ./www/a;
        index a.html;
    }
    location /b {
        root ./www/b;
    }
    location /c {
        index c.html;
    }
}
