# Bytes, K, M, a limit of 0, an absent directive and the largest accepted value.
server {
    listen 8101;
    root ./www/site1;
    client_max_body_size 1024;
    location /k {
        client_max_body_size 10K;
    }
    location /m {
        client_max_body_size 10M;
    }
    location /zero {
        client_max_body_size 0;
    }
    location /absent {
        methods GET;
    }
    location /max {
        client_max_body_size 8796093022207M;
    }
}
