# Inherited and own values, server directives written after the locations, implicit "/".
server {
    location /inherits {
        methods GET;
    }
    location /own {
        root ./www/own;
        index own.html;
        client_max_body_size 0;
        error_page 404 ./own404.html;
        error_page 403 ./own403.html;
    }
    listen 8110;
    root ./www/site1;
    index home.html;
    client_max_body_size 2M;
    error_page 404 ./server404.html;
    error_page 500 ./server500.html;
}

# Only the mandatory directives: the default values reach the implicit "/".
server {
    listen 8111;
    root ./www/site2;
}
